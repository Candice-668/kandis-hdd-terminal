<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent 战术大屏</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 系列外壳 —— 每个主题是一块铺满视口的独立画面（各自的 Shadow DOM，样式和 id 互不干扰），外壳只负责切换和记住选择。
   主题自己的按钮里有「主题」入口，打开下面的选择面板；T 键快速轮换。外壳的面板固定用深色，盖在任何主题上都清楚。 */
:root{
  color-scheme:dark;
  --page:#07080d; --sheet:rgba(10,11,16,.96); --sheet-line:#262a39; --sheet-ink:#eef0f7; --sheet-mute:#7d8298;
  --acc:#45e6f5; --acc-2:#ff3f8e; --scrim:rgba(3,4,8,.6);
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --display:"Archivo","Noto Sans SC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page);overflow:hidden}
.th-host{position:relative;height:100%}
.picker{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:var(--scrim);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.pk{width:min(560px,100%);box-sizing:border-box;background:var(--sheet);border:1px solid var(--sheet-line);border-radius:8px;padding:16px 16px 12px;font-family:var(--mono);color:var(--sheet-ink);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pk-h b{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.01em}
.pk-h span{font-size:10px;letter-spacing:.16em;color:var(--sheet-mute);flex:1}
.pk-x{font:700 13px/1 var(--mono);color:var(--sheet-mute);background:none;border:1px solid var(--sheet-line);border-radius:4px;padding:5px 8px;cursor:pointer}
.pk-x:hover{color:var(--sheet-ink);border-color:var(--sheet-ink)}
.pk-list{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--sheet-line);border-radius:6px;padding:8px 12px 8px 8px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}
.tcard:focus-visible,.pk-x:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tcard[aria-current="true"]{border-color:var(--acc-2);box-shadow:inset 0 0 0 1px var(--acc-2)}
.tcard em{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--acc-2);visibility:hidden}
.tcard[aria-current="true"] em{visibility:visible}
.tn{display:grid;gap:3px;min-width:0}
.tn b{font-size:13px;font-weight:800;letter-spacing:.04em}
.tn small{font-size:10.5px;color:var(--sheet-mute);font-family:"Noto Sans SC",var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:84px;height:48px;border-radius:4px;display:block;box-sizing:border-box}
.sw-ops{background:radial-gradient(circle at -30% 55%,transparent 58%,#151515 58.6% 59.6%,transparent 60.2% 77%,#151515 77.6% 78.4%,transparent 79%),repeating-linear-gradient(-28deg,transparent 0 9px,rgba(21,21,21,.18) 9px 10px),#eeede8}
.sw-spider{border:4px solid #ec4fae;background:linear-gradient(118deg,transparent 46%,#45e6f5 47% 48.5%,transparent 49.5%),linear-gradient(62deg,transparent 54%,#45e6f5 55% 56.5%,transparent 57.5%),radial-gradient(circle at 51% 50%,#ff3f8e 0 3px,transparent 3.5px),#0b0c12}
.tcard.next{cursor:default;border-style:dashed;opacity:.55}
.tcard.next:hover{border-color:var(--sheet-line)}
.sw-next{border:1px dashed var(--sheet-mute);background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(125,130,152,.15) 6px 7px)}
.pk-f{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:9.5px;letter-spacing:.08em;color:var(--sheet-mute);flex-wrap:wrap}
@media (max-width:480px){.tcard{grid-template-columns:64px minmax(0,1fr)}.sw{width:64px;height:40px}.tcard em{display:none}}
</style>

<div class="th-host" id="host-ops" hidden></div>
<div class="th-host" id="host-spider" hidden></div>

<div class="picker" id="picker" hidden>
 <div class="pk" role="dialog" aria-modal="true" aria-labelledby="pkT">
  <div class="pk-h"><b id="pkT">AGENT 战术大屏</b><span>THEME SERIES · 主题</span><button class="pk-x" id="pkX" type="button" aria-label="关闭">✕</button></div>
  <div class="pk-list">
   <button class="tcard" type="button" data-theme-id="ops"><span class="sw sw-ops" aria-hidden="true"></span><span class="tn"><b>01 · OPS 纸面工程</b><small>纸与墨的工程图 · 调度飞轮 · 可切夜间荧光</small></span><em>当前</em></button>
   <button class="tcard" type="button" data-theme-id="spider"><span class="sw sw-spider" aria-hidden="true"></span><span class="tn"><b>02 · SPIDER 蛛网战术</b><small>粉框作战室 · 巡检蛛 · token 账与交付飞轮</small></span><em>当前</em></button>
   <div class="tcard next" aria-disabled="true"><span class="sw sw-next" aria-hidden="true"></span><span class="tn"><b>03 · 下一款</b><small>系列主题筹备中</small></span></div>
  </div>
  <div class="pk-f"><span>按 T 键直接轮换主题 · 选择会被记住</span><span>DEVELOP BY @赛博老爸</span></div>
 </div>
</div>

<!-- ===== 主题 01 · OPS 纸面工程（原 Agent Ops 调度大屏） ===== -->
<template id="tpl-ops">
<style>
/* Layout: 纸面工程图式大屏 —— 顶部指标轨 + 圆心偏左的大弧舞台（静止的汇聚连线 / 快速旋转的飞轮：环带数据块 + 外射谱线）+ 底部 2×4 仪表面板。浅色 = 纸与墨，深色 = 夜间荧光绿 */
:host{
  --bg:#eeede8; --panel:#f6f5f1; --band:#eeede8;
  --ink:#151515; --ink2:#4a4a46; --mute:#86857f; --hair:#d2d0c9; --hair2:#e4e2dc;
  --accent:#151515; --bar:#151515; --chip-fg:#f6f5f1; --scan:transparent;
  --c-line:#151515; --c-hi:#000000; --c-hot:#000000; --c-text:#1a1a1a; --c-dim:#7d7c77;
  --font:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","JetBrains Mono",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }}
:host([data-theme="dark"]){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }

:host{display:block;height:100%;overflow:auto}
[hidden]{display:none!important}
:host{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:11px;-webkit-font-smoothing:antialiased}
.app{min-height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(440px,1fr) auto;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 顶部指标轨 */
.top{position:absolute;z-index:3;left:0;top:0;display:grid;grid-template-columns:repeat(3,minmax(86px,auto));gap:12px 26px;align-items:end;padding:14px 48px 34px 16px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg);background:radial-gradient(farthest-side at 0 0,color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 45%,transparent) 62%,transparent)}
.top .title{grid-column:1 / -1}
.cell{position:relative;min-width:0;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.stat{min-width:86px}
.cell::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .9s ease}
.cell.on::after{width:100%}
.title::after{width:100%;height:2px;background:var(--ink)}
.title h1{margin:0;font-weight:800;font-size:clamp(16px,1.5vw,23px);letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.title h1 .zh{font-family:var(--cjk);font-weight:700;letter-spacing:.04em}
.title p{margin:5px 0 0;font-size:8.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:8px;letter-spacing:.16em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k i{font-style:normal;font-family:var(--cjk);letter-spacing:.04em;margin-left:5px}
.stat .v{display:block;margin-top:6px;font-size:clamp(13px,1.05vw,16px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{color:var(--mute);font-size:.78em}
.ctls{position:absolute;z-index:4;top:14px;right:14px;display:flex;gap:6px}
.btn{font:inherit;font-size:10px;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--mute);padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:var(--cjk)}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,#pc:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* 舞台 */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
.note{position:absolute;z-index:2;right:14px;bottom:14px;display:grid;gap:4px;min-width:220px;border-left:2px solid var(--ink);padding:4px 4px 4px 12px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.note .nh{font-size:8px;letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--hair);padding-bottom:5px;white-space:nowrap}
.note b{font-size:12.5px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-family:var(--font);white-space:nowrap}
.note .ns{font-size:9px;color:var(--mute);font-family:var(--cjk)}
.hud{position:absolute;z-index:2;right:14px;bottom:96px;display:grid;gap:3px;border-left:2px solid var(--ink);padding:3px 4px 3px 12px;font-size:8.5px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.hud b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.hud .warn{color:var(--accent);font-weight:700}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--ink);padding:6px 9px;font-size:10.5px;line-height:1.55;font-family:var(--cjk);max-width:250px}
.tip b{font-family:var(--font);font-weight:700;margin-right:6px}
.tip span{display:block;color:var(--mute);font-family:var(--font);font-size:9px}

/* 面板 */
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.panel{min-width:0;height:184px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);padding:9px 11px 8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;min-width:0}
.ph h2{margin:0;font-size:9px;font-weight:800;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph h2 i{font-style:normal;font-family:var(--cjk);font-weight:500;color:var(--mute);letter-spacing:.06em;margin-left:6px}
.ph span{font-size:8.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.pb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pf{margin-top:6px;font-size:8px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf b{color:var(--ink);font-weight:500}

.feed{list-style:none;margin:0;padding:0;height:100%;font-size:9.5px;line-height:13.5px}
.feed li{display:grid;grid-template-columns:2.4em 3.4em minmax(0,1fr);gap:8px;white-space:nowrap}
.feed .n{color:var(--mute);font-variant-numeric:tabular-nums}
.feed .vb{color:var(--ink2)}
.feed .d{overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.feed li:last-child{font-weight:700}
.feed li:last-child .d{font-weight:700}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}
.seg button{font:inherit;font-size:8px;letter-spacing:.14em;padding:4px 0;border:1px solid var(--hair);background:transparent;color:var(--ink2);cursor:pointer}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--chip-fg)}
#pc{cursor:crosshair}

.code{margin:0;height:100%;font-size:9.5px;line-height:13px;overflow:hidden}
.code .row{display:block;white-space:pre}
.code .row.cur{background:var(--hair2)}
.code .ln{color:var(--mute);margin-right:12px;user-select:none}
.code .kw{font-weight:800}
.code .str{color:var(--ink2)}
.code .cm{color:var(--mute)}
.caret{display:inline-block;width:.6em;height:11px;vertical-align:-2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.agents{list-style:none;margin:0;padding:0;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-flow:column;column-gap:16px}
.agents li{display:grid;grid-template-columns:1.7em 2.3em minmax(0,1fr);gap:6px;align-items:center;font-size:9.5px;min-width:0}
.agents .n{color:var(--mute);font-variant-numeric:tabular-nums}
.agents .r{font-family:var(--cjk)}
.agents li.idle .r{color:var(--mute)}
.agents .b{display:grid;gap:2px;min-width:0}
.agents .b b{display:block;height:5px;background:var(--hair2);position:relative;overflow:hidden}
.agents .b b i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);transition:width .6s ease}
.agents .b small{font-size:7.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}

@media (max-width:1100px){
  .panels{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .app{grid-template-rows:auto auto}
  .top{right:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;padding:10px 10px 18px}
  .top .title{box-sizing:border-box;padding-right:178px}
  .stat{min-width:0}
  .ctls{right:10px;top:10px}
  .stage{height:150vw;max-height:720px}
  .note{right:10px;bottom:10px;min-width:0;max-width:calc(100% - 20px);box-sizing:border-box}
  .hud{display:none}
  .panels{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.cell::after{transition:none}.caret{animation:none}}

/* 系列水印：贴着舞台左下角，和图上的小标签同一套字 */
.wm{position:absolute;z-index:2;left:16px;bottom:12px;font-family:var(--font);font-size:8px;letter-spacing:.18em;color:var(--mute);opacity:.62;pointer-events:none;white-space:nowrap;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg)}
</style>
<div class="app">
  <main class="stage" id="stage">
  <header class="top">
    <div class="cell title">
      <h1>AGENT OPS / <span class="zh">调度中心</span></h1>
      <p>TASKS → AGENTS → OUTPUTS · 示例数据 · <b id="clock">--</b></p>
    </div>
    <div class="cell stat"><span class="k">TASKS<i>任务</i></span><span class="v" id="s0">64</span></div>
    <div class="cell stat"><span class="k">AGENTS<i>智能体</i></span><span class="v" id="s1">12</span></div>
    <div class="cell stat"><span class="k">WORKFLOWS<i>工作流</i></span><span class="v" id="s2">11</span></div>
    <div class="cell stat"><span class="k">OUTPUTS<i>产出</i></span><span class="v" id="s3">0</span></div>
    <div class="cell stat"><span class="k">MATCHED<i>已匹配</i></span><span class="v" id="s4">0</span></div>
    <div class="cell stat"><span class="k">PENDING<i>待复核</i></span><span class="v" id="s5">0</span></div>
  </header>
  <div class="ctls">
    <button class="btn" id="theme" type="button">夜间</button>
    <button class="btn" id="pause" type="button" aria-pressed="false">暂停</button>
    <button class="btn" type="button" data-series-pick>换主题</button>
  </div>
    <canvas id="sc" aria-label="调度主视图：左侧连线汇聚到三个工作流节点，中间旋转环带滚动执行记录，右侧旋转谱线表示输出流"></canvas>
    <div class="hud"><span>STABILITY CHECK · 稳定性</span><span>CFL = |u|·Δt/Δx = <b id="cfl">0.00</b> <span id="cflst">OK</span></span></div>
    <div class="note"><span class="nh">WORKFLOW / REVIEW STATE</span><b id="noteMain">— / 11 已匹配</b><span class="ns">— 每条结果都能追溯到来源</span></div>
    <div class="tip" id="tip" hidden></div>
    <div class="wm">DEVELOP BY @赛博老爸</div>
  </main>

  <section class="panels">
    <article class="panel">
      <div class="ph"><h2>TASK FEED<i>任务流</i></h2><span>64 tasks</span></div>
      <div class="pb"><ol class="feed" id="feed"></ol></div>
    </article>
    <article class="panel">
      <div class="ph"><h2>ADVECTION / PARTICLE SOLVER<i>粒子求解</i></h2><span id="stepN">step 561</span></div>
      <div class="pb" id="pcBox"><canvas id="pc" tabindex="0" aria-label="粒子流场，点击加入涡流"></canvas></div>
      <div class="seg" role="group" aria-label="求解模式">
        <button type="button" data-m="advect" class="on">ADVECT</button>
        <button type="button" data-m="project">PROJECT</button>
        <button type="button" data-m="rerun">RERUN</button>
      </div>
    </article>
    <article class="panel">
      <div class="ph"><h2>WORKSPACE<i>执行代码</i></h2><span id="codeMeta">python</span></div>
      <div class="pb"><pre class="code" id="code"></pre></div>
    </article>
    <article class="panel">
      <div class="ph"><h2>12 AGENTS / DISPATCH<i>调度</i></h2><span id="agMeta">0 idle</span></div>
      <div class="pb"><ul class="agents" id="agents"></ul></div>
      <div class="pf">independent jobs / shared event bus</div>
    </article>
  </section>
</div>
</template>

<!-- ===== 主题 02 · SPIDER 蛛网战术 ===== -->
<template id="tpl-spider">
<style>
/* Layout: 1920×1080 固定画布按视口等比缩放。粉色外框 → 标题轨 → 7×2 智能体卡 → 中部：作战室（左）+ 产出曲线 / 任务流（右）→ 底部：质检台 / 调度规则 / 执行代码。
   巡检蛛 CRAWLER 在整块屏上爬，腿抓住正在发生事情的地方。单一深色视觉，刻意不做浅色版。 */
:host{
  color-scheme:dark;
  --frame:#ec4fae; --frame-hi:#ff7fcb; --frame-deep:#b42f80; --frame-ink:#1b0613;
  --bg:#07080d; --panel:#0b0c12; --panel-2:#10121a; --line:#1b1e2a; --line-2:#262a39;
  --ink:#eef0f7; --ink-2:#b8bccb; --mute:#73788e; --dim:#454a5e;
  --cyan:#45e6f5; --joint:#ff3f8e; --good:#35e08a; --bad:#ff4d5e; --warn:#ffb020; --sticky:#ffd84a;
  --stage:#0a0c13; --wall:#0e1019; --wall-2:#0b0d15; --floor:#0b0d14; --desk:#2a2e3b; --desk-front:#181b25; --metal:#343949; --screen:#05070c;
  --display:"Archivo","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%}
[hidden]{display:none!important}
:host{background:var(--frame);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{height:100%;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(130% 100% at 50% 0%,var(--frame-hi),var(--frame) 50%,var(--frame-deep))}
.fit{position:relative;width:100%;height:100%;overflow:hidden}
.board{position:absolute;left:50%;top:50%;width:1920px;height:1080px;box-sizing:border-box;padding:8px;transform:translate(-50%,-50%) scale(var(--s,.5));display:grid;grid-template-rows:50px 172px 562px 250px;row-gap:10px}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:500 12px/1.4 var(--cjk);color:var(--frame-ink);display:none}
@media (orientation:portrait) and (max-width:820px){.hint{display:block}}

/* ---------- 标题轨 ---------- */
.hdr{display:flex;align-items:center;gap:22px;color:var(--frame-ink);min-width:0;padding:0 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:8px;background:var(--frame-ink);color:var(--frame-hi);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.hdr h1{margin:0;font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.hdr h1 em{font-style:normal;opacity:.5;margin:0 6px}
.hdr h1 .zh{font-family:var(--cjk);font-weight:900;font-size:30px;letter-spacing:.04em}
.tagline{display:grid;gap:2px;font-size:11px;letter-spacing:.14em;font-weight:800;white-space:nowrap}
.tagline small{font-size:9.5px;font-weight:500;letter-spacing:.12em;opacity:.75}
.spacer{flex:1}
.goal{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.goal .gl small{font-weight:500;opacity:.7;margin-left:4px}
.track{width:240px;height:16px;border:2px solid var(--frame-ink);border-radius:3px;position:relative;overflow:hidden;box-sizing:border-box}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(-45deg,var(--frame-ink) 0 6px,var(--frame-deep) 6px 10px);transition:width .6s ease}
.day{font-weight:800;font-size:13px;letter-spacing:.1em;white-space:nowrap}
.btns{display:flex;gap:6px}
.btn{font:800 11px/1 var(--mono);letter-spacing:.08em;color:var(--frame-ink);background:transparent;border:2px solid var(--frame-ink);border-radius:4px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,.btn[aria-pressed="true"]{background:var(--frame-ink);color:var(--frame-hi)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.clock{background:var(--frame-ink);color:var(--frame-hi);font:800 22px/1 var(--mono);padding:10px 14px;border-radius:5px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- 智能体卡 ---------- */
.cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0}
.card{--c:#fff;min-width:0;min-height:0;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px 6px;display:grid;grid-template-rows:26px 15px 3px 13px;row-gap:3px;transition:box-shadow .25s,border-color .25s}
.card.hit{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(69,230,245,.35)}
.c1{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:26px;height:26px;flex:none}
.nm{min-width:0;flex:1;display:grid}
.nm b{font-family:var(--display);font-weight:900;font-size:17px;line-height:15px;color:var(--c);letter-spacing:.01em}
.nm span{font-family:var(--cjk);font-size:9.5px;line-height:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{font-style:normal;font-size:8px;line-height:1;letter-spacing:.12em;color:var(--joint);border:1px solid rgba(255,63,142,.55);border-radius:2px;padding:3px 4px;align-self:flex-start;white-space:nowrap}
.c3{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.c3 .k{font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c3 .v{font-size:16px;line-height:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s linear}
.c4{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:9.5px;line-height:13px;min-width:0}
.c4 .q{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c4 .st{color:var(--mute);white-space:nowrap;font-size:8.5px;letter-spacing:.06em}
.card.idle .q{color:var(--dim)}
.card.work .st{color:var(--c)}
.card.move .st{color:var(--cyan)}
.cs{display:grid;grid-template-columns:1fr auto 1fr auto;column-gap:8px;font-size:9px;line-height:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.cs b{color:var(--ink);font-weight:500;text-align:right}
.card.crawl{grid-template-rows:26px 22px 13px;row-gap:3px}
.card.crawl .c4 .q{color:var(--cyan)}

/* ---------- 中部 ---------- */
.mid{display:grid;grid-template-columns:1340px minmax(0,1fr);gap:10px;min-height:0}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cn{position:absolute;width:18px;height:18px;border-color:var(--ink-2);border-style:solid;opacity:.55;pointer-events:none}
.cn.a{left:6px;top:6px;border-width:1px 0 0 1px}.cn.b{right:6px;top:6px;border-width:1px 1px 0 0}
.cn.c{left:6px;bottom:6px;border-width:0 0 1px 1px}.cn.d{right:6px;bottom:6px;border-width:0 1px 1px 0}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--cyan);padding:7px 10px;font-size:11px;line-height:1.55;max-width:260px;font-family:var(--cjk)}
.tip b{font-family:var(--mono);font-weight:800;margin-right:6px}
.tip span{display:block;color:var(--mute);font-family:var(--mono);font-size:10px}
.side{display:grid;grid-template-rows:392px minmax(0,1fr);gap:10px;min-height:0}
.pnl.fly{padding:0;position:relative;overflow:hidden}
.fly canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fh{position:absolute;left:12px;top:10px;pointer-events:none;text-shadow:0 0 3px var(--panel),0 0 8px var(--panel),0 0 14px var(--panel)}
.fh h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--ink);white-space:nowrap}
.fh h2 i{font-style:normal;font-family:var(--cjk);font-weight:500;color:var(--mute);letter-spacing:.06em;margin-left:6px}
.fh p{margin:4px 0 0;font-size:9.5px;color:var(--cyan);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big.fhud{right:10px;top:10px;width:164px;box-sizing:border-box;padding:8px 10px 9px;background:rgba(11,12,18,.84);border-left:2px solid var(--cyan);pointer-events:none}
.fnote{position:absolute;right:10px;bottom:8px;font-size:9px;color:var(--mute);letter-spacing:.04em;pointer-events:none;white-space:nowrap;text-shadow:0 0 3px var(--panel),0 0 8px var(--panel)}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 12px 10px;display:flex;flex-direction:column;min-width:0;min-height:0;box-sizing:border-box}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;min-width:0}
.ph h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--ink);white-space:nowrap}
.ph h2 i{font-style:normal;font-family:var(--cjk);font-weight:500;color:var(--mute);letter-spacing:.06em;margin-left:6px}
.ph .r{font-size:10px;letter-spacing:.1em;color:var(--joint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ob{flex:1;position:relative;min-height:0}
.ob canvas{position:absolute;inset:0;width:100%;height:100%}
.big{position:absolute;right:2px;top:14px;display:flex;flex-direction:column;gap:6px;width:158px}
.big span{font-size:9px;letter-spacing:.14em;color:var(--mute)}
.big b{font-size:30px;line-height:1;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(53,224,138,.35)}
.kv2{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.kv2 em{font-style:normal;font-size:16px;line-height:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv2 em.tk{color:var(--cyan)} .kv2 em.cost{color:var(--sticky)} .kv2 em.sm{font-size:12.5px;color:var(--ink-2)}
.feed{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;font-size:10.5px;line-height:15px}
.feed li{display:grid;grid-template-columns:58px 60px 34px minmax(0,1fr);gap:8px;white-space:nowrap;padding:0 4px;border-radius:2px}
.feed time{color:var(--dim);font-variant-numeric:tabular-nums}
.feed b{font-weight:800;letter-spacing:.04em}
.feed em{font-style:normal;color:var(--ink-2)}
.feed span{overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.feed li.bad em,.feed li.bad span{color:var(--bad)}
.feed li.ship em{color:var(--good)}
.feed li.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(69,230,245,.16)}to{background:transparent}}

/* ---------- 底部 ---------- */
.bot{display:grid;grid-template-columns:652px 620px minmax(0,1fr);gap:10px;min-height:0}
.rv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:12px}
.rv-l{display:grid;grid-template-rows:16px 30px minmax(0,1fr);gap:6px;min-width:0;min-height:0}
.tk{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;font-size:12px}
.tk .id{font-weight:800;color:var(--warn)}
.tk b{font-family:var(--cjk);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9px;letter-spacing:.08em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:2px;padding:1px 5px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stats div{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:2px 6px;display:grid;min-width:0}
.stats span{font-size:8px;color:var(--mute);letter-spacing:.08em;line-height:11px;white-space:nowrap}
.stats b{font-size:11px;line-height:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qbox{position:relative;min-height:0;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.qbox canvas{position:absolute;inset:0;width:100%;height:100%}
.rv-r{display:grid;grid-template-rows:minmax(0,1fr) 24px;gap:6px;min-height:0}
.chk{list-style:none;margin:0;padding:6px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;display:grid;align-content:space-between;font-size:10px;line-height:14px}
.chk li{display:grid;grid-template-columns:minmax(0,1fr) auto 38px;gap:8px;align-items:center}
.chk .n{color:var(--ink-2);font-family:var(--cjk)}
.chk .vl{color:var(--mute);font-variant-numeric:tabular-nums}
.chk .s{text-align:right;font-weight:800;letter-spacing:.06em}
.s.pass{color:var(--good)} .s.drop{color:var(--bad)} .s.wait{color:var(--dim)} .s.run{color:var(--warn)}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;border:1px solid var(--line-2);border-radius:3px;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.verdict.pass{border-color:rgba(53,224,138,.5);color:var(--good)} .verdict.drop{border-color:rgba(255,77,94,.6);color:var(--bad)} .verdict.run{color:var(--warn)}
.rtab{width:100%;border-collapse:collapse;margin-top:6px;font-size:9.5px;table-layout:fixed}
.rtab td{padding:2px 6px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.rtab td:first-child{color:var(--dim);width:44px}.rtab td:nth-child(2){width:52px;color:var(--ink)}
.rtab td:nth-child(4){width:42px;font-weight:800}.rtab td:last-child{width:36px;text-align:right;color:var(--mute)}
.rl{flex:1;min-height:0;font-size:10px;line-height:13.6px;display:grid;align-content:start}
.rl .row{display:grid;grid-template-columns:minmax(0,1fr) 78px 64px 14px;gap:10px;padding:0 6px}
.rl .row span:nth-child(2){color:var(--mute);text-align:right}
.rl .row span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
.rl .row .ok{color:var(--good)} .rl .row .no{color:var(--bad)} .rl .row .pd{color:var(--dim)}
.rl .row.cur{background:rgba(255,63,142,.08)}
.rl .hd{color:var(--ink);padding:0 6px;margin-top:3px}
.rl .hd i{font-style:normal;color:var(--mute)}
.rl .k{padding-left:10px;color:var(--ink-2)}
.flow{border-top:1px solid var(--line);padding-top:7px;display:grid;gap:5px}
.flow .fl{font-size:9px;letter-spacing:.12em;color:var(--mute)}
.chips{display:flex;align-items:center;gap:5px;font-size:10px}
.chips span{border:1px solid rgba(53,224,138,.45);color:var(--good);border-radius:3px;padding:2px 7px;transition:background .3s,color .3s}
.chips span.on{background:var(--joint);border-color:var(--joint);color:var(--frame-ink);font-weight:800}
.chips i{font-style:normal;color:var(--dim)}
.code{margin:0;flex:1;min-height:0;font-size:10.5px;line-height:14px;overflow:hidden;font-family:var(--mono)}
.code .row{display:block;white-space:pre}
.code .row.cur{background:rgba(255,255,255,.05)}
.code .ln{color:var(--dim);margin-right:12px;user-select:none}
.code .kw{color:var(--joint);font-weight:700}
.code .str{color:var(--good)}
.code .cm{color:var(--mute)}
.caret{display:inline-block;width:.6em;height:12px;vertical-align:-2px;background:var(--cyan);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#spider{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.caret{animation:none}.feed li.new{animation:none}.track i,.bar i{transition:none}}

<script>
/* ===== 主题 01 · OPS 纸面工程 ===== */
function mountOps(host, SR){
'use strict';

const CODEBITS = ['eqs = extract(spec.p)','solve(grid, dt=0.004)','log(claim, consts)','assert stable(state)','check_mass(state, ref)',
  'flag(blind_spots)','drift = compare(out, ref)','rerun(scene_07)','cite(page=12)','metric = spec.metric()','state = step(inputs)',

/* 飞轮转速（弧度/秒），越大转得越快 */
const SPIN = 0.16;

/* ================= 2. 工具 ================= */
const $ = s => SR.querySelector(s);
const TAU = Math.PI * 2;
const FONT = '"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const root = host;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (rr, a) => a[(rr() * a.length) | 0];
const pad2 = n => String(n).padStart(2, '0');
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const wrapPI = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const rgba = (hex, a) => { let h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function fitCv(cv, ctx){ const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2); const w = Math.max(1, r.width), h = Math.max(1, r.height); cv.width = Math.round(w * d); cv.height = Math.round(h * d); ctx.setTransform(d, 0, 0, d, 0, 0); return [w, h]; }
function qd(c, q){ c.beginPath(); c.moveTo(q.x1, q.y1); c.quadraticCurveTo(q.cx, q.cy, q.x2, q.y2); c.stroke(); }
function bez(q, u){ const v = 1 - u; return [v*v*q.x1 + 2*v*u*q.cx + u*u*q.x2, v*v*q.y1 + 2*v*u*q.cy + u*u*q.y2]; }

/* 主题：颜色全部来自 CSS 变量 */
let T = {};
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : darkMQ.matches;
function readTheme(){
  const cs = getComputedStyle(root), g = n => cs.getPropertyValue(n).trim();
  T = {dark: isDark(), bg: g('--bg'), panel: g('--panel'), band: g('--band'), ink: g('--ink'), ink2: g('--ink2'), mute: g('--mute'),
       hair: g('--hair'), hair2: g('--hair2'), line: g('--c-line'), hi: g('--c-hi'), hot: g('--c-hot'), text: g('--c-text'), dim: g('--c-dim')};
  T.cell = T.dark ? T.ink2 : T.ink;

  themeBtn.setAttribute('aria-label', T.dark ? '切换到纸面主题' : '切换到夜间主题');
}

/* ================= 3. 模拟引擎（接真实数据时替换这一段） ================= */
const R = mulberry32(20261016);
const NA = CONFIG.agents.length, NW = CONFIG.workflows.length;
const tasks = Array.from({length: 64}, (_, i) => ({i, id: 'T-' + String(i + 1).padStart(3, '0'),
  name: CONFIG.taskNames[(R() * CONFIG.taskNames.length) | 0], wf: (R() * NW) | 0, prog: 0, state: 'queued', agent: -1}));
const agents = CONFIG.agents.map(([code, name], i) => ({i, code, name, task: -1}));
const wfs = CONFIG.workflows.map((name, i) => ({i, id: 'W' + pad2(i + 1), name, q: 0, cells: Array.from({length: 16}, () => R())}));
[0.91, 0.86, 0.72, 0.88, 0.84, 0.69, 0.93, 0.82, 0.74, 0.87, 0.71].forEach((q, i) => wfs[i].q = q);
const order = tasks.map(t => t.i);
for (let i = order.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
order.slice(0, 22).forEach(i => { tasks[i].state = 'done'; tasks[i].prog = 1; });
order.slice(22, 32).forEach((i, k) => { const t = tasks[i]; t.state = 'run'; t.prog = 0.06 + R() * 0.85; t.agent = k; agents[k].task = i; });

const running = () => agents.filter(a => a.task >= 0).length;
const doneCount = () => tasks.filter(t => t.state === 'done').length;
const matched = () => wfs.filter(w => w.q >= 0.8).length;

let logN = 38;
const feed = [];
const VERB = {read: '读取', build: '生成', check: '核验', review: '复核'};
function log(verb, t){ feed.push({n: logN++, verb, text: `${VERB[verb]} ${t.name}`}); if (feed.length > 30) feed.shift(); }
order.slice(8, 20).forEach((i, k) => log(['read', 'build', 'check', 'review'][k % 4], tasks[i]));

function step(){
  for (const a of agents) {
    if (a.task < 0) continue;
    const t = tasks[a.task];
    t.prog = Math.min(1, t.prog + 0.03 + Math.random() * 0.08);
    if (t.prog >= 1) { t.state = 'done'; t.agent = -1; a.task = -1; log(Math.random() < 0.5 ? 'check' : 'review', t); }
  }
  for (const a of agents) {
    if (a.task >= 0 || Math.random() > 0.4) continue;
    const q = tasks.filter(t => t.state === 'queued');
    if (!q.length) break;
    const t = q[(Math.random() * q.length) | 0];
    t.state = 'run'; t.agent = a.i; t.prog = 0.02; a.task = t.i; log(Math.random() < 0.5 ? 'read' : 'build', t);
  }
  const done = tasks.filter(t => t.state === 'done');
  if (done.length > 54) for (let k = 0; k < 18; k++) { const t = done[(Math.random() * done.length) | 0]; t.state = 'queued'; t.prog = 0; }
  const w = wfs[(Math.random() * NW) | 0];
  w.q = Math.max(0.6, Math.min(0.97, w.q + (Math.random() - 0.38) * 0.05));
  w.cells[(Math.random() * 16) | 0] = Math.random();
  renderAll();
}

/* ================= 4. DOM 面板 ================= */
const themeBtn = $('#theme'), pauseBtn = $('#pause');
const feedEl = $('#feed'), agentsEl = $('#agents'), codeEl = $('#code');

function renderStats(){
  const run = running(), m = matched();

  $('#noteMain').textContent = `${m} / ${NW} 已匹配 · ${NW - m} 待复核`;
  $('#agMeta').textContent = `${NA - run} idle`;
}
function renderFeed(){
  const n = Math.max(4, Math.floor(feedEl.clientHeight / 13.5));
  feedEl.innerHTML = feed.slice(-n).map(e => `<li><span class="n">${String(e.n).padStart(3, '0')}</span><span class="vb">${e.verb}</span><span class="d">${e.text}</span></li>`).join('');
}
function renderAgents(){
  agentsEl.innerHTML = agents.map(a => {
    const t = a.task >= 0 ? tasks[a.task] : null;
    const st = t ? `${t.id} · ${t.prog < 0.35 ? 'reading' : t.prog < 0.75 ? 'working' : 'review'}` : 'idle';
    return `<li class="${t ? 'busy' : 'idle'}"><span class="n">${a.code}</span><span class="r">${a.name}</span><span class="b"><b><i style="width:${t ? Math.max(4, t.prog * 100).toFixed(0) : 0}%"></i></b><small>${st}</small></span></li>`;
  }).join('');
}
function renderAll(){ renderStats(); renderFeed(); renderAgents(); if (hoverHub >= 0) showTip(); }

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const hl = s => s.trim().startsWith('#') ? `<span class="cm">${esc(s)}</span>`
  : esc(s).replace(/('[^']*'?)/g, '<span class="str">$1</span>').replace(/\b(for|in|if|def|return|not|assert|lambda)\b/g, '<span class="kw">$1</span>');

/* 执行代码：逐字打出一套，停顿后换另一套；一轮内不重复，也不会连着出现同一套 */
let codeOrder = [], codeIdx = -1, cset = null, cl = 0, cc = 0, hold = 0, linePause = 0;
function nextCodeSet(){
  if (!codeOrder.length) {
    codeOrder = CONFIG.codeSets.map((_, i) => i).filter(i => i !== codeIdx);
    for (let i = codeOrder.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [codeOrder[i], codeOrder[j]] = [codeOrder[j], codeOrder[i]]; }
  }
  codeIdx = codeOrder.shift();
  cset = CONFIG.codeSets[codeIdx]; cl = 0; cc = 0; hold = 0; linePause = 0;
  const a = agents[cset.agent] || agents[0];
  $('#codeMeta').textContent = `${cset.file} · ${a.code} ${a.name}`;
}
function renderCode(){
  const fit = Math.max(4, Math.floor(codeEl.clientHeight / 13));
  let html = '';
  for (let i = Math.max(0, cl - fit + 1); i <= cl; i++) {
    const txt = i < cl ? cset.lines[i] : cset.lines[i].slice(0, cc);
    html += `<span class="row${i === cl ? ' cur' : ''}"><span class="ln">${String(i + cset.start).padStart(3, '0')}</span>${hl(txt)}${i === cl ? '<span class="caret"></span>' : ''}</span>`;
  }
  codeEl.innerHTML = html;
}
function typeTick(){
  if (hold > 0) { if (--hold === 0) nextCodeSet(); renderCode(); return; }
  if (linePause > 0) { linePause--; return; }
  cc += Math.random() < 0.3 ? 2 : 1;
  if (cc >= cset.lines[cl].length) {
    cc = cset.lines[cl].length;
    if (cl < cset.lines.length - 1) { renderCode(); cl++; cc = 0; linePause = 5; }
    else hold = 60;
  }
  renderCode();
}

/* ================= 5. 主舞台 ================= */
const stage = $('#stage'), sc = $('#sc'), sctx = sc.getContext('2d'), tip = $('#tip');
let W = 1, H = 1, DPR = 1, G = null, layThreads = null, layRing = null;
let hubs = [], pulses = [], blocks = [], streaks = [], blockFS = 8, blockLH = 11;
let hoverHub = -1, needs = true, stageDirty = true, panelsNeed = true;
const hubWf = [4, 0, 8], hubCh = [-10, -10, -10];   // 三个汇聚节点当前对应的工作流、上次切换时间
let hubTurn = 0;
const ax = (Rr, y) => G.cx + Math.sqrt(Math.max(0, Rr * Rr - (y - G.cy) * (y - G.cy)));
const visAng = (Rr, pad) => Math.asin(Math.min(1, (Math.max(G.cy, H - G.cy) + pad) / Rr));
function mkLayer(){ const cv = document.createElement('canvas'); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return [cv, c]; }
function bloom(cv, c, amount){
  if (!T.dark || typeof c.filter !== 'string') return;
  const g = document.createElement('canvas'); g.width = cv.width; g.height = cv.height;
  const gc = g.getContext('2d'); gc.filter = `blur(${3 * DPR}px)`; gc.drawImage(cv, 0, 0);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = amount; c.drawImage(g, 0, 0); c.restore();
}

function layoutStage(){
  const r = sc.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  sc.width = Math.round(W * DPR); sc.height = Math.round(H * DPR);
  const narrow = W < 700;
  const R1 = narrow ? Math.max(H * 0.8, W * 0.85) : Math.max(H * 0.72, W * 0.24);
  const cx = W * (narrow ? 0.36 : 0.40) - R1;
  G = {cx, cy: H * 0.5 + (narrow ? 70 : 22), R1, R2: R1 + W * (narrow ? 0.26 : 0.22), narrow};
  buildStreaks(); buildThreads(); buildRing(); buildBlocks();
}

/* --- 飞轮谱线：整圈生成，每帧只画可见扇区 --- */
function buildStreaks(){
  const rr = mulberry32(5), thVis = visAng(G.R2, 30);
  const density = (G.narrow ? 420 : 1100) / (2 * thVis);
  streaks = [];
  const mk = (th, Lc, hot) => {
    const s = {th: ((th % TAU) + TAU) % TAU, off: 20 + rr() * 4, f: Lc * (0.7 + rr() * 0.42), b: (rr() * 4) | 0, hot, d: []};
    const nd = rr() < 0.42 ? 1 + ((rr() * 2) | 0) : 0;
    for (let i = 0; i < nd; i++) s.d.push({p: rr() * 0.92, len: 4 + rr() * 34, v: 0});
    if (rr() < 0.3) s.d.push({p: rr(), len: 5 + rr() * 20, v: 0.05 + rr() * 0.22});
    streaks.push(s);
  };
  let a = 0;
  while (a < TAU) {
    const spread = 0.008 + rr() * 0.045, n = Math.round(spread * 2 * density * (0.6 + rr() * 0.9));
    const Lc = 0.28 + rr() * 0.72, hot = rr() < 0.14;
    for (let j = 0; j < n; j++) mk(a + (rr() * 2 - 1) * spread, Lc, hot);
    a += spread * 2 + rr() * 0.05;
  }
  const nl = Math.round(density * 0.25 * TAU);
  for (let j = 0; j < nl; j++) mk(rr() * TAU, 0.15 + rr() * 0.85, false);
}

function buildThreads(){
  const [cv, c] = mkLayer(), rr = mulberry32(99), {cx, cy, R1, narrow} = G;
  const k = narrow ? 0.5 : 1, A = T.dark ? 1.3 : 1;
  const inner = y => ax(R1, y);
  const rp = (padR = 8) => { const y = rr() * H; return [rr() * Math.max(10, inner(y) - padR), y]; };
  c.save(); c.beginPath(); c.arc(cx, cy, R1 - 1, 0, TAU); c.clip();
  c.lineCap = 'round'; c.strokeStyle = T.line;
  for (let i = 0; i < Math.round(360 * k); i++) {
    const [x1, y1] = rp(), [x2, y2] = rp();
    c.globalAlpha = Math.min(1, (0.05 + rr() * 0.2) * A); c.lineWidth = 0.45 + rr() * 0.5;
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo((x1 + x2) / 2 + (rr() - 0.5) * 90, (y1 + y2) / 2 + (rr() - 0.5) * 90, x2, y2); c.stroke();
  }
  for (let i = 0; i < Math.round(22 * k); i++) {
    const rad = 200 + rr() * 900, a0 = rr() * TAU;
    c.globalAlpha = (0.08 + rr() * 0.16) * A; c.lineWidth = 0.6;
    c.beginPath(); c.arc(rr() * W * 0.4 - rad * 0.3, rr() * H, rad, a0, a0 + 0.3 + rr() * 0.8); c.stroke();
  }
  hubs = [];
  (narrow ? [-0.2, 0.07, 0.3] : [-0.33, 0.01, 0.34]).forEach((off, h) => {
    const y = cy + H * off, x = inner(y) - 3, hub = {x, y, curves: [], wf: [4, 0, 8][h]};
    const n = Math.round((narrow ? 40 : 80) + rr() * 30);
    for (let i = 0; i < n; i++) {
      const sy = y + (rr() - 0.5) * H * 1.1, sx = rr() * Math.max(20, x - 60);
      const q = {x1: sx, y1: sy, cx: x - (x - sx) * (0.18 + rr() * 0.25), cy: y + (sy - y) * (0.02 + rr() * 0.18), x2: x, y2: y + (rr() - 0.5) * 3};
      hub.curves.push(q);
      c.strokeStyle = T.dark && rr() < 0.22 ? T.hi : T.line;
      c.globalAlpha = Math.min(1, (0.14 + rr() * 0.5) * A); c.lineWidth = 0.45 + rr() * 0.7; qd(c, q);
    }
    c.strokeStyle = T.dark ? T.hi : T.line; c.globalAlpha = 1; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(x - 16, y); c.lineTo(x + 1, y); c.stroke();
    hubs.push(hub);
  });
  c.strokeStyle = T.line; c.fillStyle = T.line; c.lineWidth = 0.8;
  for (let i = 0; i < Math.round(28 * k); i++) { const [x, y] = rp(20), s = 3 + rr() * 3; c.globalAlpha = 0.7 * A; c.strokeRect(x - s / 2, y - s / 2, s, s); }
  for (let i = 0; i < Math.round(14 * k); i++) { const [x, y] = rp(20); c.globalAlpha = 0.6 * A; c.beginPath(); c.arc(x, y, 2.5 + rr() * 6, 0, TAU); c.stroke(); }
  for (let i = 0; i < Math.round(16 * k); i++) { const [x, y] = rp(20); c.globalAlpha = 0.85; c.beginPath(); c.arc(x, y, 1.4 + rr() * 1.6, 0, TAU); c.fill(); }
  c.lineWidth = 1.6;
  for (let i = 0; i < Math.round(26 * k); i++) { const [x, y] = rp(20), a = rr() * TAU, l = 5 + rr() * 9; c.globalAlpha = 0.8; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  { const [x, y] = rp(130); c.lineWidth = 0.9; c.globalAlpha = 0.75; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(x + i * 15, y - i * 4, 3.2, 0, TAU); c.stroke(); } }
  c.restore();
  c.globalAlpha = 1;

/* ================= 5. 每帧推进 ================= */
function simStep(dt){
  chiefT -= dt;
  if (chiefT <= 0) { chiefT = rnd(1.5, 2.8); if (tasks.length < 22) dispatch(); }
  for (const a of workers) {
    if (a.path.length) {
      const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy), st = 165 * dt;
      if (Math.abs(dx) > .5) a.look = Math.sign(dx);
      if (d <= st) { a.x = p.x; a.y = p.y; a.path.shift(); if (!a.path.length && a.after) { const f = a.after; a.after = null; f(); } }
      else { a.x += dx / d * st; a.y += dy / d * st; }
      continue;
    }
    if (a.carry) continue;
    if (!a.cur) {
      if (a.inbox.length) { if (a.at !== 'seat') goSeat(a); else startWork(a); }
      else if (a.at === 'seat') { a.idleT += dt; if (a.idleT > 7 && Math.random() < dt * .25) goLounge(a); }
    } else if (a.at === 'seat') {
      a.prog += dt / a.dur;
      if (a.prog >= 1) finishStage(a);
    }
  }
  for (let i = packets.length - 1; i >= 0; i--) { const k = packets[i]; k.t += dt / k.dur; if (k.t >= 1) { packets.splice(i, 1); k.done && k.done(); } }
  for (let i = papers.length - 1; i >= 0; i--) { const p = papers[i]; p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt; if (p.life <= 0) papers.splice(i, 1); }
  crawl.pages += Math.random() < dt * 3 ? 1 : 0;
  crawl.read += Math.random() < dt * 2.4 ? 1 : 0;
  const m = nowMin();
  if (m !== binMin) { binMin = m; bins.shift(); bins.push({d: 0, r: 0, tok: 0}); }
  tokenStep(dt);
}

    if (animT < flyGlitchUntil) { c.setTransform(1, 0, 0, 1, 0, 0); for (let k = 0; k < 3; k++) { const y = Math.random() * flyCv.height, h = (4 + Math.random() * 20) * FK, dx = (Math.random() - .5) * 30 * FK; c.drawImage(flyCv, 0, y, flyCv.width, h, dx, y, flyCv.width, h); } }
  }
}
function renderFlyHud(){
  $('#outBig').textContent = fmt(total);
  $('#kTok').textContent = fmtTok(tokDay);
  $('#kCost').textContent = '¥' + costDay().toFixed(2);
  $('#kPer').textContent = `${fmtTok(tokDay / total)} tok · ¥${(costDay() / total).toFixed(3)}`;
  $('#flyRpm').textContent = `转速 ${(spinVel / TAU * 60).toFixed(2)} rpm · 近 1 分钟交付 ${kicks.length} 件`;
}
function showFlyTip(){
  const h = hubs[hoverHub]; if (!h) { flyTip.hidden = true; return; }
  const wi = hubWf[hoverHub], w = WF[wi], inflight = tasks.filter(t => t.wf === wi), live = inflight.filter(t => AG[t.owner] && AG[t.owner].cur === t).length;
  flyTip.innerHTML = `<b>${w.id}</b>${w.zh} → ${CH[w.ch].zh}<span>${w.path.map(nameOf).join(' → ')}</span><span>在途 ${inflight.length} 件 · 正在做 ${live} 件 · 汇入 ${h.curves.length} 条线</span>`;
  flyTip.hidden = false;
  const tw = flyTip.offsetWidth, th = flyTip.offsetHeight;
  flyTip.style.left = clamp(h.x + 14, 8, FW - tw - 8) + 'px';
  flyTip.style.top = clamp(h.y + 16, 8, FH - th - 8) + 'px';
}
flyCv.addEventListener('pointermove', e => {
  if (!G) return;
  const r = flyCv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * FW, y = (e.clientY - r.top) / r.height * FH;
  let h = -1; hubs.forEach((hb, i) => { if (Math.hypot(x - (hb.x - 6), y - hb.y) < 34) h = i; });
  hoverHub = h; if (h >= 0) showFlyTip(); else flyTip.hidden = true;
});
flyCv.addEventListener('pointerleave', () => { hoverHub = -1; flyTip.hidden = true; });

/* ================= 9. 尺寸 / 主循环 / 控制 ================= */
function layout(){
  const fw = fitEl.clientWidth, fh = fitEl.clientHeight;
  if (fw < 2 || fh < 2) return;   // 主题被隐藏时不重排
  S = Math.max(.1, Math.min(fw / 1920, fh / 1080));
  board.style.setProperty('--s', S);
  const dpr = window.devicePixelRatio || 1;
  SK = clamp(S * dpr, 1, 2);
  sc.width = Math.round(SW * SK); sc.height = Math.round(SH * SK);
  SK2 = clamp(S * dpr, .6, 1.5);
  spc.width = Math.round(1920 * SK2); spc.height = Math.round(1080 * SK2);
  buildLayer();
  [QW, QH] = fitCv(qCv, qctx);
  layoutFly();
  measure();
  drawQ(); renderFlyHud();
  needs = true;
}
let last = performance.now(), domAcc = 0, outAcc = 0, needs = true, lastTotal = -1;
function frame(now){
  requestAnimationFrame(frame);
  if (host.hidden) { last = now; return; }
  const real = Math.min(.05, (now - last) / 1000); last = now;
  const dt = paused ? 0 : real * speed;
  if (!paused) animT += real;
  if (dt > 0) {
    simT += dt;
    try { simStep(dt); } catch (e) { console.error(e); }
  }
  if (!paused) spiderStep(real * Math.min(speed, 2));
  if (dt > 0 || needs) {
    try { drawStage(); drawFly(dt); drawSpider(); } catch (e) { console.error(e); }
    needs = false;
  }
  domAcc += real; outAcc += real;
  if (domAcc > .12 || needs) {
    domAcc = 0;
    try { renderCards(); renderFeed(); renderReview(); renderRules(); renderFlow(); renderHeader(); } catch (e) { console.error(e); }
  }
  if (outAcc > .25) { outAcc = 0; try { drawQ(); renderFlyHud(); } catch (e) { console.error(e); } }
}
const btnPause = $('#btnPause'), btnSpeed = $('#btnSpeed'), btnFull = $('#btnFull');
function setPaused(p){ paused = p; btnPause.textContent = p ? '继续' : '暂停'; btnPause.setAttribute('aria-pressed', String(p)); needs = true; }
btnPause.addEventListener('click', () => setPaused(!paused));
btnSpeed.addEventListener('click', () => { speed = speed === 1 ? 3 : 1; btnSpeed.textContent = '×' + speed; btnSpeed.setAttribute('aria-pressed', String(speed > 1)); });
btnFull.addEventListener('click', () => {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => { btnFull.textContent = '不支持'; setTimeout(() => btnFull.textContent = '全屏', 1500); });
  } catch (e) { /* 部分窗口不允许全屏 */ }
});
document.addEventListener('fullscreenchange', () => { btnFull.textContent = document.fullscreenElement ? '退出全屏' : '全屏'; });
document.addEventListener('keydown', e => { if (host.hidden) return; if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPaused(!paused); } });

buildCards(); buildRules();
new ResizeObserver(() => layout()).observe(fitEl);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildLayer(); CARD_ORDER.forEach(i => { const img = cardEls[i] && cardEls[i].el.querySelector('.av'); if (img) img.src = avatarURL(AG[i]); }); measure(); needs = true; });
layout();
// 巡检蛛开场：抓住 SCOUT 的卡
{ const r0 = deskRect(AG[3]); SP.x = r0.x + r0.w / 2; SP.y = r0.y + r0.h / 2; }
plantLegs();
SP.tgt = {kind: 'patrol', rect: () => deskRect(AG[3]), text: `巡检 COPY · ${AG[3].cur ? AG[3].cur.id : ''} 先读再派`, web: true, dur: 3, card: -1};
arrive();
nextCodeSet(); renderCode();
clockTick(); setInterval(clockTick, 1000);
setInterval(() => { if (!paused && !host.hidden) typeTick(); }, 34);
renderCards(); renderFeed(); renderReview(); renderRules(); renderFlow(); renderHeader();
setPaused(reduce);
requestAnimationFrame(frame);
}

/* ================= 系列外壳：挂载主题、切换、记住选择 ================= */
(() => {
  'use strict';
  const THEMES = {
    ops:    {host: 'host-ops',    tpl: 'tpl-ops',    mount: mountOps},
    spider: {host: 'host-spider', tpl: 'tpl-spider', mount: mountSpider}
  };
  const ORDER = ['ops', 'spider'], KEY = 'agent-series-theme';
  const mounted = {}, picker = document.getElementById('picker');
  let cur = null, lastFocus = null;
  function show(id){
    if (!THEMES[id]) id = 'spider';
    ORDER.forEach(k => { document.getElementById(THEMES[k].host).hidden = k !== id; });
    const T = THEMES[id], host = document.getElementById(T.host);
    if (!mounted[id]) {
      mounted[id] = true;
      const SR = host.attachShadow({mode: 'open'});
      SR.appendChild(document.getElementById(T.tpl).content.cloneNode(true));
      try { T.mount(host, SR); } catch (e) { console.error(e); }
      SR.querySelectorAll('[data-series-pick]').forEach(b => b.addEventListener('click', openPicker));
    }
    cur = id;
    document.documentElement.dataset.series = id;
    document.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.setAttribute('aria-current', String(b.dataset.themeId === id)));
    try { localStorage.setItem(KEY, id); } catch (e) { /* 存不了就算了 */ }
    try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (e) { /* 预览环境可能不让改地址 */ }
  }
  function openPicker(){ lastFocus = document.activeElement; picker.hidden = false; const c = picker.querySelector('.tcard[aria-current="true"]') || picker.querySelector('.tcard'); c && c.focus(); }
  function closePicker(){ picker.hidden = true; try { lastFocus && lastFocus.focus && lastFocus.focus(); } catch (e) {} }
  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });
  document.getElementById('pkX').addEventListener('click', closePicker);
  picker.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.addEventListener('click', () => { show(b.dataset.themeId); closePicker(); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !picker.hidden) { closePicker(); return; }
    const tag = (e.target && e.target.tagName) || '';
    if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      show(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);
    }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (THEMES[h] && h !== cur) show(h); });
  let start = location.hash.slice(1);
  if (!THEMES[start]) { try { start = localStorage.getItem(KEY) || ''; } catch (e) { start = ''; } }
  show(THEMES[start] ? start : 'spider');
})();
</script>
